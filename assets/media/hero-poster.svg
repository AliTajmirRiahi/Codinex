<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191A1D"/>
      <stop offset="0.55" stop-color="#202226"/>
      <stop offset="1" stop-color="#17181B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C83FF"/>
      <stop offset="1" stop-color="#25D6EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5B63E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5B63E8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#FFFFFF" fill-opacity="0.035"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <!-- brand -->
  <rect x="66" y="70" width="64" height="64" rx="15" fill="#26282D" stroke="#383A40"/>
  <image href="data:image/png;base64," x="76" y="80" width="44" height="44"/>
  <text x="148" y="119" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#F6F7F9">Codinex<tspan fill="#8B93FF"> AI</tspan></text>

  <!-- headline -->
  <text x="72" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#F6F7F9">Your AI stack.</text>
  <text x="72" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="url(#accent)">Your rules.</text>
  <text x="74" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#9AA4B2">Provider-agnostic, local-first AI coding assistant for Visual Studio</text>

  <!-- faux chat panel -->
  <rect x="72" y="404" width="560" height="232" rx="16" fill="#26282D" stroke="#383A40" stroke-width="1"/>
  <circle cx="100" cy="436" r="6" fill="#8B93FF"/>
  <text x="118" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9AA4B2">You</text>
  <rect x="118" y="454" width="360" height="12" rx="6" fill="#3A3D44"/>
  <rect x="118" y="476" width="286" height="12" rx="6" fill="#3A3D44"/>

  <circle cx="100" cy="516" r="6" fill="url(#accent)"/>
  <text x="118" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9AA4B2">Codinex</text>
  <rect x="118" y="534" width="486" height="10" rx="5" fill="#33363D"/>
  <rect x="118" y="552" width="440" height="10" rx="5" fill="#33363D"/>
  <rect x="118" y="574" width="220" height="34" rx="8" fill="#1F2933" stroke="#2F6F7E" stroke-width="1"/>
  <text x="134" y="596" font-family="Consolas, monospace" font-size="14" fill="#6FE3F2">+ changeset  ·  build  ·  tests</text>

  <!-- play button -->
  <circle cx="946" cy="392" r="200" fill="url(#glow)"/>
  <circle cx="946" cy="392" r="88" fill="#1C1D21"/>
  <circle cx="946" cy="392" r="88" fill="none" stroke="url(#accent)" stroke-width="5"/>
  <path d="M924 348 L998 392 L924 436 Z" fill="#F6F7F9"/>

  <!-- provider pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#C9CFDA">
    <g transform="translate(1040,150)">
      <rect x="0" y="0" width="168" height="40" rx="20" fill="#26282D" stroke="#383A40"/>
      <circle cx="24" cy="20" r="5" fill="#10A37F"/><text x="42" y="26">OpenAI</text>
    </g>
    <g transform="translate(1006,206)">
      <rect x="0" y="0" width="202" height="40" rx="20" fill="#26282D" stroke="#383A40"/>
      <circle cx="24" cy="20" r="5" fill="#D97757"/><text x="42" y="26">Anthropic</text>
    </g>
    <g transform="translate(1034,262)">
      <rect x="0" y="0" width="174" height="40" rx="20" fill="#26282D" stroke="#383A40"/>
      <circle cx="24" cy="20" r="5" fill="#4285F4"/><text x="42" y="26">Gemini</text>
    </g>
    <g transform="translate(1048,536)">
      <rect x="0" y="0" width="160" height="40" rx="20" fill="#26282D" stroke="#383A40"/>
      <circle cx="24" cy="20" r="5" fill="#E6E6E6"/><text x="42" y="26">Ollama</text>
    </g>
    <g transform="translate(1030,592)">
      <rect x="0" y="0" width="178" height="40" rx="20" fill="#26282D" stroke="#383A40"/>
      <circle cx="24" cy="20" r="5" fill="#7C83FF"/><text x="42" y="26">Local LLM</text>
    </g>
  </g>

  <!-- bottom caption -->
  <text x="640" y="682" text-anchor="middle" font-family="Consolas, monospace" font-size="19" letter-spacing="1" fill="#7E8794">prompt  &#8594;  references  &#8594;  agentic tools  &#8594;  reviewed changeset  &#8594;  build  &#8594;  tests  &#8594;  commit</text>
</svg>
